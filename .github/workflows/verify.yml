name: Verify Romy engine schema (ephemeral)
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'tests/sql/office-romy-*.sql'
      - 'tests/office-romy-*.test.mjs'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-schema:
    name: Isolated Supabase migrations and RLS acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all Office Node tests without production connections
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start offline local Supabase
        run: |
          if ! supabase start >/tmp/office-local-start.log 2>&1; then
            echo "Ephemeral Supabase failed to start. Detailed runtime logs suppressed to protect local credentials."
            exit 1
          fi
      - name: Reapply Office migrations locally, never on a linked database
        run: |
          if ! supabase db reset --local >/tmp/office-local-reset.log 2>&1; then
            echo "Ephemeral Office schema migrations failed; detailed logs suppressed."
            exit 1
          fi
      - name: Verify two-owner and two-project SQL isolation in a rolled-back transaction
        run: |
          container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          if [ -z "$container" ]; then echo "Ephemeral database container not found"; exit 1; fi
          docker exec -i "$container" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < tests/sql/office-romy-phase1-acceptance.sql
      - name: Verify no generated fixtures persist in the ephemeral database
        run: |
          container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          docker exec -i "$container" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "select case when exists(select 1 from public.conversations where id='44444444-4444-4444-8444-444444444441') then 1/0 else 1 end;"
