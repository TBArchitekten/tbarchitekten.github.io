name: Romy · nächtliche Projektakte-Pflege
# Only after review and merge on main. OIDC ties the caller to this workflow.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  akte:
    if: github.repository == 'TBArchitekten/tbarchitekten.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Request ephemeral GitHub OIDC token and trigger Office maintenance
        shell: bash
        env:
          PROJECT_REF: ynzsbemisjvfgbqcqliq
        run: |
          set -euo pipefail
          oidc=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=minds-akte-pflege")
          token=$(printf '%s' "$oidc" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          test -n "$token"
          # Token and response bodies must never be written to logs or artifacts.
          code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/window-akte-pflege" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' --data '{}')
          test "$code" = "200"
