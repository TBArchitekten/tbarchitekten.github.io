name: Verify Romy synced engine (offline tests + Deno)
on:
  push:
    branches: ['romy-isabella/**']
  pull_request:
    branches: ['romy-isabella/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source SHA manifest, exclusions and Office test suite
        run: node --test tests/*.test.mjs
      - name: Verify sync CLI parses without network access
        run: node --check scripts/sync-window.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check every reviewable Office-profile Edge Function
        run: |
          deno check \
            supabase/functions/isabella-agent-shadow/index.ts \
            supabase/functions/isabella-artifact/index.ts \
            supabase/functions/isabella-artifact-intake/index.ts \
            supabase/functions/isabella-capability-runner/index.ts \
            supabase/functions/isabella-capability-runtime/index.ts \
            supabase/functions/isabella-chat/index.ts \
            supabase/functions/isabella-chat-runner/index.ts \
            supabase/functions/isabella-delivery-runner/index.ts \
            supabase/functions/isabella-dream/index.ts \
            supabase/functions/isabella-heartbeat/index.ts \
            supabase/functions/isabella-live-session/index.ts \
            supabase/functions/isabella-mission-runner/index.ts \
            supabase/functions/isabella-operating-model/index.ts \
            supabase/functions/isabella-presence/index.ts \
            supabase/functions/isabella-routine-runner/index.ts \
            supabase/functions/isabella-runtime-mcp/index.ts \
            supabase/functions/isabella-self-review/index.ts \
            supabase/functions/isabella-transcribe/index.ts \
            supabase/functions/isabella-work-ingest-runner/index.ts \
            supabase/functions/window-akte-pflege/index.ts
      - name: Type-check OAuth-scoped Office MCP connector
        run: deno check supabase/functions/office-mcp/index.ts
