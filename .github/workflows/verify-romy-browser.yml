name: Verify Romy chat in Chromium (offline)
on:
  push:
    branches: ['romy-isabella/**']
  pull_request:
    branches: [main, 'romy-isabella/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test runner without scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install isolated Chromium browser
        # The runner image has Chromium's system libraries; --with-deps is only the fallback, because
        # it needs the Ubuntu package mirror (unreachable for hours on 11.11.2026).
        run: npx playwright install chromium || npx playwright install --with-deps chromium
      - name: Exercise real browser transport, receipts and per-member chat using synthetic doubles
        env:
          CI: 'true'
        run: node --test tests/browser/romy-chat.chromium.mjs tests/browser/romy-live.chromium.mjs tests/browser/office-app-boot.chromium.mjs
      - name: Exercise LPH3 Musterplanner read-only desktop and mobile board separately
        env:
          CI: 'true'
        run: node --test tests/browser/office-musterplanner.chromium.mjs
