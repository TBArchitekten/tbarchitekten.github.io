name: Verify Romy chat in Chromium (offline)
on:
  push:
    branches: ['romy-isabella/**']
  pull_request:
    branches: [main, 'romy-isabella/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test runner without scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 pdfjs-dist@6.2.108
      - name: Install isolated Chromium browser
        # The runner image has Chromium's system libraries; --with-deps is only the fallback, because
        # it needs the Ubuntu package mirror (unreachable for hours on 11.11.2026).
        run: npx playwright install chromium || npx playwright install --with-deps chromium
      - name: Exercise real browser transport, receipts and per-member chat using synthetic doubles
        env:
          CI: 'true'
        run: node --test tests/browser/romy-chat.chromium.mjs tests/browser/romy-live.chromium.mjs tests/browser/office-app-boot.chromium.mjs
      - name: Exercise the guide «Was darf auf den Desktop?» (shown once when switched on, «Gelesen» before «Weiter», stays closed otherwise, read again, iPhone) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-leitfaden.chromium.mjs
      - name: Exercise LPH3 Musterplanner read-only desktop and mobile board separately
        env:
          CI: 'true'
        run: node --test tests/browser/office-musterplanner.chromium.mjs tests/browser/office-planner-terminplan-sync.chromium.mjs
      - name: Exercise the Planner board and its cards (scroll position, every responsible person, status, checklist wrap and reorder, tool tabs, bucket info) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-planner-board.chromium.mjs tests/browser/office-planner-karten.chromium.mjs
      - name: Exercise the Terminplan as a Work tab (frame, borrowed app bridge, no back link, revision for Work) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-terminplan-reiter.chromium.mjs
      - name: Exercise the one assistant window of Terminplan and Kostenberechnung (move collapsed and open, resize, remembered, iPhone) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-assistent-fenster.chromium.mjs
      - name: Exercise Kostenberechnung (Archicad import, revision conflict, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-kostenberechnung.chromium.mjs
      - name: Exercise Produktbibliothek (read a datasheet, review, project use, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-produktbibliothek.chromium.mjs
      - name: Exercise Herstellerkatalog (filters, company sheet, contacts per project, link to the library, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-herstellerkatalog.chromium.mjs
      - name: Exercise Controlling (overview bars, project sheet, hours per person, payments from gross, member view without rates and salaries, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-controlling.chromium.mjs
      - name: Exercise Kostenarchiv and Datenpool (archive read-only, own-project unit prices with provenance, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-kostenarchiv.chromium.mjs
      - name: Exercise Projektstart documents (clarification and decision lists, decision memo with numbers from the office, Word and Excel, iPhone width) with a synthetic Supabase
        env:
          CI: 'true'
        run: node --test tests/browser/office-projektdokumente.chromium.mjs tests/browser/office-projektdokumente-zahlen.chromium.mjs tests/browser/office-mustermappe.chromium.mjs
