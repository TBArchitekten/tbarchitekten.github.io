name: Deploy Supabase Edge Functions
# Manual on purpose: merging code never changes production by itself (merge ≠ deploy).
# Run from GitHub → Actions → "Deploy Supabase Edge Functions" → Run workflow,
# listing the functions to deploy separated by spaces. Same pattern as Window.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions to deploy, separated by spaces (e.g. office-assistant office-terminplan-ai)'
        required: true
        default: 'office-assistant'
      profile_set_in_dashboard:
        description: 'ASSISTANT_PROFILE=office is already set in Supabase → Edge Functions → Secrets (only needed while the token cannot set secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'TBArchitekten/tbarchitekten.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The access token lives in this environment, so no other workflow can read it.
    environment: supabase
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ynzsbemisjvfgbqcqliq
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the tests first
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a secret of the 'supabase' environment (Settings → Environments)."
            exit 1
          fi
      - name: Validate function names
        run: |
          set -f
          for f in $FUNCTIONS; do
            if ! [[ "$f" =~ ^[a-z0-9-]+$ ]] || [ ! -f "supabase/functions/$f/index.ts" ]; then
              echo "::error::Unknown function: $f"; exit 1
            fi
          done
      - name: Pin the Office assistant profile
        # The shared engine defaults to Window; in Office it must always run as Romy (not a secret).
        # An engine function never goes out unless the profile is pinned here or confirmed as set.
        env:
          PROFILE_CONFIRMED: ${{ inputs.profile_set_in_dashboard }}
        run: |
          set -f
          if ! echo " $FUNCTIONS " | grep -Eq ' (isabella-[a-z0-9-]+|window-akte-pflege) '; then echo "no engine function in this deploy"; exit 0; fi
          if supabase secrets set ASSISTANT_PROFILE=office --project-ref "$PROJECT_REF" >/dev/null 2>&1; then echo "profile pinned"; exit 0; fi
          if [ "$PROFILE_CONFIRMED" = "true" ]; then echo "::notice::The token cannot set secrets; relying on ASSISTANT_PROFILE=office set in the dashboard."; exit 0; fi
          echo "::error::Could not set ASSISTANT_PROFILE=office (the token has no secrets permission). Set it in Supabase → Edge Functions → Secrets, then run again with 'profile_set_in_dashboard' checked."
          exit 1
      - name: Deploy
        run: |
          set -f
          for f in $FUNCTIONS; do
            echo "::group::Deploying $f"
            # verify_jwt and entrypoint come from supabase/config.toml.
            # --yes: the CLI asks for confirmation and a workflow cannot answer; running it is the confirmation.
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --yes
            echo "::endgroup::"
          done
      - name: Check the deployed functions still ask for sign-in
        # verify_jwt functions must answer 401; the runners (verify_jwt = false) check their own secret
        # and must refuse an anonymous call with a 4xx. A 2xx or 5xx (boot error) fails the run.
        run: |
          set -f
          for f in $FUNCTIONS; do
            [ "$f" = "office-romy-mission-runner" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$f" -H 'Content-Type: application/json' -d '{}')
            echo "$f → HTTP $code"
            if awk -v f="[functions.$f]" '$0==f{s=1;next} /^\[/{s=0} s&&/^verify_jwt = false/{found=1} END{exit !found}' supabase/config.toml; then
              case "$code" in 4??) ;; *) echo "::error::$f answered $code to an anonymous call (expected 4xx)"; exit 1;; esac
            elif [ "$code" != "401" ]; then echo "::error::$f answered $code without sign-in (expected 401)"; exit 1; fi
          done
