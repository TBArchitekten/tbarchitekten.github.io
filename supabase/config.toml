# verify_jwt per function; the deploy workflow reads it from here.
[functions.office-admin]
verify_jwt = true
entrypoint = "./functions/office-admin/index.ts"

[functions.office-assistant]
verify_jwt = true
entrypoint = "./functions/office-assistant/index.ts"

[functions.office-terminplan-ai]
verify_jwt = true
entrypoint = "./functions/office-terminplan-ai/index.ts"

# Called by the database cron with its own secret header, not by browsers.
[functions.office-romy-mission-runner]
verify_jwt = false
entrypoint = "./functions/office-romy-mission-runner/index.ts"

# Claude connector (remote MCP). It answers the unauthenticated 401 itself (OAuth discovery)
# and checks the Supabase JWT and the office membership on every request.
[functions.office-mcp]
verify_jwt = false
entrypoint = "./functions/office-mcp/index.ts"

